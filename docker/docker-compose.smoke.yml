services:
  postgres:
    container_name: auth-optrax-smoke-postgres
    env_file: !override
      - ./smoke/.env
    volumes:
      - smoke_pgdata:/var/lib/postgresql/data
  keycloak:
    container_name: auth-optrax-smoke-keycloak
    env_file: !override
      - ./smoke/.env
    volumes:
      - ./smoke/realm.json:/opt/keycloak/data/import/realm.json:ro
  app:
    container_name: auth-optrax-smoke-app
    image: auth-optrax-app:smoke
    env_file: !override
      - ./smoke/.env
  nginx:
    container_name: auth-optrax-smoke-nginx
    ports: !override
      - "127.0.0.1:18080:80"
      - "127.0.0.1:18443:443"
    volumes:
      - ./smoke/certs:/etc/nginx/certs:ro

volumes:
  smoke_pgdata:

networks:
  optrax-network:
    ipam:
      config:
        - subnet: 10.254.221.0/24
