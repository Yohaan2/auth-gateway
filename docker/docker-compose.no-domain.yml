# Override para servidor sin dominio ni TLS (HTTP por IP, puerto 80).
# NO es autosuficiente: se combina con docker-compose.yml (una sola fuente de verdad).
# Desde la raíz del repo:
#   docker compose -p auth-gateway --env-file .env \
#     -f docker/docker-compose.yml -f docker/docker-compose.no-domain.yml up -d --build
# (`-p auth-gateway` mantiene el volumen pgdata de despliegues anteriores.)
# Guía: DESPLIEGUE_SIN_DOMINIO.md

services:
  keycloak:
    environment:
      # Sin dominio fijo el hostname no puede ser estricto.
      KC_HOSTNAME_STRICT: "false"

  app:
    environment:
      # HTTP sin TLS: la app lo rechaza en producción salvo con este flag (ver server/src/config/env.ts).
      INSECURE_HTTP: "true"
      KEYCLOAK_ALLOWED_CLIENT_IDS: ${KEYCLOAK_ALLOWED_CLIENT_IDS:-optrax-frontend}

  nginx:
    volumes:
      # Mismo destino que en el compose base: sustituye la plantilla HTTPS por la HTTP.
      - ../nginx/default.no-domain.conf:/etc/nginx/templates/default.conf.template:ro
