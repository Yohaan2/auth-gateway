# Stack completo para VPS sin DNS ni TLS (HTTP por IP, puerto 80).
# Desde la raíz del repo:
#   docker compose -f docker/docker-compose.no-domain.yml build
#   docker compose -f docker/docker-compose.no-domain.yml up -d
#
# .env: APP_URL, KEYCLOAK_URL, VITE_* con http://<IP> (ver DESPLIEGUE_SIN_DOMINIO.md)

services:
  realm-prepare:
    build:
      context: ..
      dockerfile: docker/Dockerfile.realm-prepare
    container_name: auth-optrax-realm-prepare
    volumes:
      - ../.env:/env/.env:ro
      - ./generated:/work/generated
    restart: "no"
    networks:
      - optrax-network

  postgres:
    image: postgres:15-alpine
    container_name: auth-optrax-postgres
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - ../server/drizzle/0000_productive_selene.sql:/opt/optrax-schema/0000.sql:ro
      - ../server/drizzle/production-iam-users.sql:/opt/optrax-schema/0001.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-auth_optrax}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - optrax-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4
    container_name: auth-optrax-keycloak
    command: start --import-realm
    env_file:
      - ../.env
    environment:
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: "xforwarded"
      KC_HOSTNAME: ${KEYCLOAK_URL:?Definir KEYCLOAK_URL en .env, ej. http://203.0.113.10/auth}
      KC_HTTP_RELATIVE_PATH: "/auth"
      KC_DB: "postgres"
    depends_on:
      postgres:
        condition: service_healthy
      realm-prepare:
        condition: service_completed_successfully
    volumes:
      - ./generated/realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 90s
    networks:
      - optrax-network

  app:
    image: auth-optrax-app:1.0.0
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:?Definir VITE_KEYCLOAK_URL en .env}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:?Definir VITE_KEYCLOAK_REALM en .env}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:?Definir VITE_KEYCLOAK_CLIENT_ID en .env}
        VITE_ADMIN_ROLE: ${VITE_ADMIN_ROLE:-SUPER_ADMIN}
        VITE_VIEWER_ROLE: ${VITE_VIEWER_ROLE:-AUDITOR}
    container_name: auth-optrax-app
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      INSECURE_HTTP: "true"
      KEYCLOAK_ALLOWED_CLIENT_IDS: ${KEYCLOAK_ALLOWED_CLIENT_IDS:-optrax-frontend}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    networks:
      - optrax-network

  nginx:
    image: nginx:alpine
    container_name: auth-optrax-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ../nginx/default.no-domain.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - optrax-network

  node-exporter:
    profiles: ["monitoring"]
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - "/:/host:ro,rslave"
    command:
      - "--path.rootfs=/host"
    networks:
      - optrax-network

  cadvisor:
    profiles: ["monitoring"]
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - optrax-network

  postgres-exporter:
    profiles: ["monitoring"]
    image: prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    env_file:
      - ../.env
    networks:
      - optrax-network

  promtail:
    profiles: ["monitoring"]
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail-config.yml:/etc/promtail/config.yml
    command:
      - -config.file=/etc/promtail/config.yml
    networks:
      - optrax-network

volumes:
  pgdata:
    driver: local

networks:
  optrax-network:
    driver: bridge
