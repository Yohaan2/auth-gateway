server {
    listen 80;
    server_name auth.optrax.io;

    # Redirección global a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name auth.optrax.io;

    # Certificado de la CA interna (instalado fuera del repositorio).
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Tamaño máximo de subida de archivos
    client_max_body_size 1M;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Redireccionar todo el tráfico al backend de Express (que sirve la app y el frontend)
    location / {
        set $upstream_app app;
        proxy_pass http://$upstream_app:3000;
        
        # Headers estándar para propagar IP real y esquema
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Redirección hacia Keycloak expuesta por el proxy
    location /auth/ {
        set $upstream_keycloak keycloak;
        # Con variable, proxy_pass NO debe llevar URI (si no, toda ruta se reescribe a /auth/).
        proxy_pass http://$upstream_keycloak:8080;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}
