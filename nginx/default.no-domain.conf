# HTTP sin dominio ni TLS (acceso por IP o cualquier Host).
# Uso: docker compose -f docker/docker-compose.no-domain.yml up -d

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 1M;

    # Re-resolver DNS de Docker al recrear contenedores (evita 502 por IP cacheada).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /auth {
        return 301 http://$host/auth/;
    }

    location /auth/ {
        set $upstream_keycloak keycloak;
        proxy_pass http://$upstream_keycloak:8080/auth/;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 80;
    }

    location / {
        set $upstream_app app;
        proxy_pass http://$upstream_app:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 80;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
