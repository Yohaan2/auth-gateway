# HTTP sin dominio ni TLS (acceso por IP o cualquier Host).
# Se monta con el override docker/docker-compose.no-domain.yml (ver DESPLIEGUE_SIN_DOMINIO.md).

# vstation: HTTP (ACME y redirección a HTTPS) lo atiende su propio nginx, publicado en 172.17.0.1:8081.
# El 443 de vstation/vault lo reparte el bloque stream de nginx.conf (SNI).
server {
    listen 80;
    listen [::]:80;
    server_name vstation.optrax.io vault.optrax.io;

    location / {
        proxy_pass http://172.17.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 1M;

    # Re-resolver DNS de Docker al recrear contenedores (evita 502 por IP cacheada).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /auth {
        return 301 http://$host/auth/;
    }

    # Keycloak admin mal generado sin prefijo /auth → evita caer en la SPA (OIDC roto).
    location = /admin {
        return 301 http://$host/auth/admin/;
    }
    location ^~ /admin/ {
        return 301 http://$host/auth/admin/;
    }

    location /auth/ {
        set $upstream_keycloak keycloak;
        # Con variable, proxy_pass NO debe llevar URI: si no, nginx reemplaza la ruta por /auth/.
        proxy_pass http://$upstream_keycloak:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 80;
    }

    location / {
        set $upstream_app app;
        proxy_pass http://$upstream_app:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 80;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
