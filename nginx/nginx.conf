# Entrada única del servidor (80/443). En 443 reparte por SNI sin terminar TLS:
#  - vstation.optrax.io / vault.optrax.io -> nginx del proyecto vstation (publicado en 172.17.0.1:8444)
#  - cualquier otro (auth.optrax.io)       -> este mismo nginx en 127.0.0.1:8443 (con PROXY protocol)
# IPs literales a propósito: con variables en proxy_pass nginx no lee /etc/hosts.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    include /etc/nginx/conf.d/*.conf;
}

stream {
    map $ssl_preread_server_name $sni_upstream {
        vstation.optrax.io 172.17.0.1:8444;
        vault.optrax.io    172.17.0.1:8444;
        default            127.0.0.1:8443;
    }

    # Solo el destino local entiende PROXY protocol (conserva la IP real del cliente).
    map $sni_upstream $sni_proxy_protocol {
        127.0.0.1:8443 on;
        default        off;
    }

    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $sni_upstream;
        proxy_protocol $sni_proxy_protocol;
    }
}
